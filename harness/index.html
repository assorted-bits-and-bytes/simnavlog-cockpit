<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SimNavLog renderer harness</title>
    <link rel="stylesheet" href="../renderer/renderer.css" />
    <style>
      body {
        background: #e5e7eb;
        font-family: sans-serif;
        margin: 0;
      }
      #controls {
        padding: 8px;
      }
      #stage {
        background: #fbfaf6;
      }
    </style>
  </head>
  <body>
    <!-- Run `npm run build` first: dist/harness.js carries the fixtures. -->
    <div id="controls">
      <label
        >Fixture
        <select id="fixture"></select
      ></label>
      <label
        >Width
        <select id="width"></select
      ></label>
    </div>
    <div id="stage"></div>
    <script src="../dist/harness.js"></script>
  </body>
</html>
